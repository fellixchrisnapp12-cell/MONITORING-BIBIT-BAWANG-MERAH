<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Bawang Merah</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="logo">OPI <span>evja</span></div>
            <nav>
                <ul>
                    <li><i class="fas fa-user"></i> Profil</li>
                    <li class="active"><i class="fas fa-th-large"></i> Dashboard</li>
                    <li><i class="fas fa-database"></i> Riwayat Data</li>
                    <li><i class="fas fa-chart-line"></i> Grafik</li>
                    <li><i class="fas fa-bell"></i> Notifikasi</li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <header>
                <div class="header-info">
                    <h1>Dashboard Monitoring</h1>
                    <p>Home / Dashboard Penyiraman Bawang Merah</p>
                </div>
                <div class="status-bar">
                    <span id="current-time">Memuat waktu...</span>
                </div>
            </header>

            <section class="dashboard-grid">
    <div class="card">
        <div class="card-icon"><i class="fas fa-battery-three-quarters"></i></div>
        <div class="card-data">
            <h2 id="baterai-persen">0 %</h2>
            <span class="label">Status Baterai</span>
            <div class="sub-data">
                <small id="baterai-volt">0 V (Input)</small>
            </div>
        </div>
    </div>

    <div id="pump-card" class="card">
        <div class="card-icon"><i class="fas fa-pump-soap"></i></div>
        <div class="card-data">
            <h2 id="status-pompa">OFF</h2>
            <span class="label">Status Pompa</span>
            <div class="sub-data">
                <small id="pump-subtext">Sistem Standby</small>
            </div>
        </div>
    </div>
</section>

                <div class="card">
                    <div class="card-icon"><i class="fas fa-battery-three-quarters"></i></div>
                    <div class="card-data">
                        <h2 id="baterai-persen">0 %</h2>
                        <span class="label">Status Baterai</span>
                        <div class="sub-data">
                            <small id="baterai-volt">0 V (Input)</small>
                        </div>
                    </div>
                    <div id="pump-card" class="card">
    <div class="card-icon"><i class="fas fa-pump-soap"></i></div>
    <div class="card-data">
        <h2 id="status-pompa">OFF</h2>
        <span class="label">Status Pompa</span>
        <div class="sub-data">
            <small id="pump-subtext">Sistem Standby</small>
        </div>
    </div>
</div>
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
