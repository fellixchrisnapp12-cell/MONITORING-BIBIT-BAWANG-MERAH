<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Bawang Merah</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>OPI</h2>
            </div>
            <div class="user-profile">
                <p>Operator Bawang</p>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li class="active"><i class="fas fa-home"></i> Dashboard</li>
                    <li><i class="fas fa-user"></i> Profil</li>
                    <li><i class="fas fa-history"></i> Riwayat Data</li>
                    <li><i class="fas fa-bell"></i> Notifikasi</li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="page-title">
                    <div class="logo">Monitoring Bibit Bawang Merah</div>
                    <a href="#" class="logout"><i class="fas fa-sign-out-alt"></i> Log out</a>
                </div>
            </header>

            <section class="top-info-row">
                <div class="dashboard-title">
                    <h1>Dashboard Monitoring</h1>
                    <p>Home / Bawang Merah</p>
                </div>
                
                <div class="top-boxes">
                    <div class="info-box">
                        <span class="box-label">Hari & Tanggal</span>
                        <div class="box-value" id="current-date">--</div>
                    </div>
                    <div class="info-box">
                        <span class="box-label">Waktu Real-time</span>
                        <div class="box-value" id="current-time">--:--</div>
                    </div>
                    <div class="info-box pump-status-box">
                        <span class="box-label">Status Pompa Air</span>
                        <div class="box-value text-green" id="pump-status">AKTIF</div>
                    </div>
                </div>
            </section>

            <section class="metrics-row">
                <div class="metric-card active-metric">
                    <i class="fas fa-thermometer-half card-icon"></i>
                    <div class="card-data">
                        <h3 id="val-suhu">22.80</h3>
                        <p>Suhu (°C)</p>
                    </div>
                </div>
                <div class="metric-card">
                    <i class="fas fa-leaf card-icon"></i>
                    <div class="card-data">
                        <h3 id="val-lembab">65.50</h3>
                        <p>Kelembapan (%)</p>
                    </div>
                </div>
                <div class="metric-card">
                    <i class="fas fa-tint card-icon"></i>
                    <div class="card-data">
                        <h3 id="val-ph">6.5</h3>
                        <p>pH Air</p>
                    </div>
                </div>
                <div class="metric-card">
                    <i class="fas fa-bolt card
